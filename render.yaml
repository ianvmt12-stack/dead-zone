# ══════════════════════════════════════════════════════════
#  DEAD ZONE — despliegue en Render
#  Site estático: el juego es 100% cliente, no hace falta servidor.
# ══════════════════════════════════════════════════════════

services:
  - type: web
    name: dead-zone
    # `static` = sitio estático (sin servidor). El juego es 100% cliente.
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    # Render sirve por defecto en *.onrender.com con HTTPS, que es
    # obligatorio para que funcione la Pointer Lock API (captura del ratón).